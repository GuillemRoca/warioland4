# Catalan text for graphics that the game stores as pre-rendered tiles.
# Dialog texts are word-wrapped automatically to the original box size.

# Pause screen, QUIT: "Progress in this course will be saved and you'll return to the
# Title Screen. Go to the Title Screen, then turn the power OFF. OK?"
pause_quit = "Es desarà el progrés d'aquest nivell i tornaràs a la pantalla de títol. Per acabar, ves al títol i apaga la consola. D'acord?"

# Pause screen, GIVE UP: "All the coins and items you collected in this course will now be lost. OK?"
pause_giveup = "Perdràs totes les monedes i els objectes que has recollit en aquest nivell. D'acord?"

no = "No"
yes = "Sí"

# Save data reset screen: "Erase all saved game data?" then "Are you sure?"
erase_all = "Vols esborrar totes les dades desades?"
are_you_sure = "N'estàs segur?"

# Pause screen buttons: RETURN / QUIT / GIVE UP
# Plain PAUSE label (boss corridors; only PAUSA supported)
pause_label = "PAUSA"
return = "TORNA"
quit = "SURT"
give_up = "ABANDONA"

# File select
delete_data = "ESBORRAR"      # DELETE DATA
fs_quit = "SURT"              # QUIT (leave delete mode)
save = "ARXIU"                # SAVE (label above the A / B file letter)
hard = "Difícil"              # Hard
s_hard = "Extrem"             # S-Hard
delete_question = "Vols esborrar-ho?"   # Delete this data?

# Title screen: PUSH START -> PREM START (START is the button name and is kept)
# Boot logo "Nintendo Presents" (only Presenta supported)
nintendo_presents = "Presenta"

# Hall of Hieroglyphs tutorial panels: "Go!" (capital + lowercase + !) and "KEY"
hall_go = "Va!"
hall_key = "CLAU"
push = "PREM"

# Shops, sound room and mini-games
exit = "SURT"     # EXIT
menu = "MENÚ"     # MENU (item shop tab)
free = "REGAL"    # FREE (item shop)
play = "JOC"      # the PLAY of "1PLAY" (mini-game shop price)
best = "MÀX"      # BEST / TOP (high score labels)
look = "MIRA"     # LOOK (Wario's Roulette)

# Shown after clearing the first level: "Your game is always saved when you go back to a passage."
save_message = "Sempre que tornes a un passadís, es desa la partida."

# Intro newspaper subtitle (monospaced, 28 and 16 cells):
# "LEGENDARY PYRAMID DISCOVERED" / "DEEP IN JUNGLE!!"
intro_subtitle = ["PIRÀMIDE LLEGENDÀRIA TROBADA", "DINS LA JUNGLA!!"]
# Second intro variant, steak-house flyer (22 and 9 cells):
# "STEAKS! EAT AS MUCH AS" / "YOU CAN!!"
steak_subtitle = ["BISTECS! MENJA'N", "A DOJO!!"]
# Lettering painted on the flyer itself (STEAKS! / Eat as much as you can!!).
# Pre-rasterised: after changing it, run tools/make_masks.py.
steak_flyer = ["BISTECS!", "Menja'n a dojo!!"]
# Currency sign of the flyer price ($10 -> €10; pre-rasterised)
steak_price = ["€"]
# Newspaper headline: "PYRAMID DISCOVERED" (letters available: P R A M I D E O S C, plus T B À)
intro_headline = "PIRÀMIDE TROBADA"
# Newspaper body: "Legendary treasure nearly found, but accidents hindered findings"
intro_body = ["Tresor llegendari", "gairebé trobat,", "però hi ha hagut", "accidents."]

# Ending: "Thank you, WARIO...♥" (only the first word is redrawn; max 70px)
ending_thanks = "Gràcies"

# After the credits: "A FEW DAYS LATER..." (one sprite per letter, max 16)
days_later = "UNS DIES DESPRÉS…"

# Boss timer runs out (TIME UP!!): two lines of the 64x48 banner
time_up = ["TEMPS", "ESGOTAT"]

# "ITEM SHOP" sign over the shop door of the boss corridors (max ~61px)
shop_sign = "BOTIGA"

# Last screen after the epilogue: THE END (assembled from the gold bars; only FI)
the_end = "FI"

# Mini-game shop preview logo: "mini" stays, "Game" is redrawn (letters J o c only)
minigame_logo = "Joc"

# Mini-game banners (all three mini-games; 1-pixel font, max 60px)
game_over = "FI DEL JOC"     # GAME OVER
game_start = "COMENÇA!"      # GAME START

# The Big Board: first and last squares of the progress strip (START / GOAL);
# a big first letter plus small letters, only these words are drawn
board_start = "INICI"
board_goal = "META"
# Decorations of a Big Board room (tileset 91): GET A GOAL starbursts
# (three lines, pre-rasterised: run tools/make_masks.py after changing them),
# NEW! badges (max 24px) and the GET! signpost plaques (max 29px)
board_burst = ["CAP", "A LA", "META"]
board_new = "NOU!"
board_get = "TEU!"

# Pinball Zone wall graffiti (VROOM!, VRM, SCREEEEE), adapted as Catalan
# onomatopoeia; pre-rasterised (run tools/make_masks.py after changing them)
pinball_sfx = ["BRRUM!", "BRM", "NYIIIIIC"]

