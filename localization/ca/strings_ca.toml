# Catalan translation of the font-encoded strings of Wario Land 4 (USA/Europe).
#
# Every entry has the original English text ("en", checked against the ROM before
# patching) and its Catalan translation ("ca").  Each string occupies a fixed slot of
# 26 characters; text is centred unless "align" says otherwise.
#
# Available characters: A-Z a-z 0-9 space . , ' & ! ? ( ) [ ] - ~
# plus the Catalan glyphs added by this patch:  à è é í ï ò ó ú ü ç ·
# (accented capitals are not available in this font).

